<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استودیو محمدجواد کجوری — آموزش حروف انگلیسی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ff; --surface:#ffffff; --text:#1d1b2e; --muted:#6b6880; --line:#e3dff5;
  --accent:#5b3df5; --accent-text:#ffffff; --ok:#12805c; --warn:#b4472c; --warn-bg:#fff0ea;
  --brand:#7c5cff; --brand2:#ff5ca8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14112a; --surface:#1f1b3d; --text:#f2f0ff; --muted:#a9a5c9; --line:#342f60;
    --accent:#8f7bff; --accent-text:#14112a; --ok:#4fd1a1; --warn:#ff9c7d; --warn-bg:#3a2326;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  min-height:100vh;
  background-image:
    radial-gradient(600px 300px at 90% 0%, rgba(124,92,255,.15), transparent 70%),
    radial-gradient(500px 300px at 0% 100%, rgba(255,92,168,.12), transparent 70%);
}
.app{max-width:560px;margin:0 auto;padding:20px 16px 40px}

.brand{
  text-align:center;margin:8px 0 24px;padding:20px 12px;
  background:linear-gradient(135deg, rgba(124,92,255,.12), rgba(255,92,168,.10));
  border:1.5px solid var(--line);border-radius:22px;
}
.brand h1{
  font-size:24px;font-weight:800;margin:0 0 6px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand p{color:var(--muted);margin:0;font-size:14px}
.brand .line{
  display:inline-block;width:40px;height:3px;border-radius:2px;margin:10px auto 0;
  background:linear-gradient(90deg,var(--brand),var(--brand2));
}

.section-title{
  display:flex;align-items:center;justify-content:space-between;
  margin:18px 0 12px;font-size:14px;color:var(--muted);font-weight:600;
}
.count-badge{
  background:rgba(124,92,255,.15);color:var(--accent);
  padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;
}
.search{
  width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--text);font:inherit;font-size:14px;outline:none;
  margin-bottom:16px;
}
.search:focus{border-color:var(--accent)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{
  background:var(--surface);border:1.5px solid var(--line);border-radius:20px;
  padding:16px 8px;font:inherit;color:var(--text);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:transform .12s, border-color .12s, box-shadow .2s;
  box-shadow:0 2px 8px -4px rgba(0,0,0,.06);
}
.cat:hover{border-color:var(--accent);box-shadow:0 8px 20px -10px rgba(124,92,255,.4)}
.cat:active{transform:scale(.96)}
.cat:focus-visible,.key:focus-visible,.back:focus-visible,.speak:focus-visible{
  outline:3px solid var(--accent);outline-offset:2px;
}
.cat .emo{font-size:32px;line-height:1}
.cat .name{font-weight:700;font-size:15px}
.cat .en{color:var(--muted);font-size:11.5px;direction:ltr}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{
  border:1.5px solid var(--line);background:var(--surface);color:var(--text);
  border-radius:12px;font:inherit;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;
}
.top h2{margin:0;font-size:18px;font-weight:800;flex:1}
.progress-bar{
  height:6px;background:rgba(124,92,255,.1);border-radius:99px;
  overflow:hidden;margin-bottom:14px;
}
.progress-bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--brand2));
  transition:width .4s;
}

.result{
  min-height:180px;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;
  padding:18px;margin-bottom:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:8px;
  transition:all .2s;
}
.result.empty{color:var(--muted);font-size:15px}
.result .letter{
  font-size:14px;color:var(--muted);direction:ltr;font-weight:600;letter-spacing:1px;
}
.result .word{
  font-size:34px;font-weight:800;direction:ltr;color:var(--accent);line-height:1.15;
  word-break:break-word;
}
.result .fa{font-size:24px;font-weight:600}
.result.none{
  background:var(--warn-bg);border-color:var(--warn);color:var(--warn);
  font-size:16px;font-weight:600;
}

/* ---------- دکمه تلفظ ---------- */
.speak{
  margin-top:12px;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;border-radius:14px;padding:12px 24px;
  font:inherit;font-weight:800;font-size:15px;
  display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 8px 20px -8px rgba(124,92,255,.7);
  transition:transform .12s, filter .15s;
}
.speak:hover{filter:brightness(1.1)}
.speak:active{transform:scale(.96)}
.speak .icon{font-size:18px;line-height:1}
.speak.speaking{
  animation:pulse 1s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 8px 20px -8px rgba(124,92,255,.7)}
  50%{box-shadow:0 8px 30px -4px rgba(255,92,168,.9)}
}

.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;direction:ltr}
.key{
  position:relative;aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--text);font:inherit;font-size:19px;
  font-weight:800;cursor:pointer;transition:transform .1s, background .15s;
}
.key:active{transform:scale(.92)}
.key.sel{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.key.done::after{
  content:"✓";position:absolute;top:2px;left:5px;font-size:10px;font-weight:800;
  color:var(--ok);
}
.key.sel.done::after{color:var(--accent-text)}
.key.none{opacity:.35;text-decoration:line-through}

.foot{
  margin-top:36px;text-align:center;color:var(--muted);font-size:12.5px;
  line-height:2;
}
.foot b{color:var(--text);font-weight:700}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">

  <section id="home">
    <div class="brand">
      <h1>🎬 استودیو محمدجواد کجوری</h1>
      <p>بازی آموزش حروف انگلیسی — دسته‌بندی موضوعی</p>
      <div class="line"></div>
    </div>

    <input type="text" class="search" id="search" placeholder="🔍 جستجوی دسته...">

    <div class="section-title">
      <span>همهٔ دسته‌ها</span>
      <span class="count-badge" id="catCount"></span>
    </div>

    <div class="grid" id="cats"></div>
  </section>

  <section id="play" hidden>
    <div class="top">
      <button class="back" id="back" type="button">→ بازگشت</button>
      <h2 id="ptitle"></h2>
    </div>

    <div class="progress-bar"><i id="progFill"></i></div>

    <div class="result empty" id="result">یک حرف را انتخاب کن</div>
    <div class="keys" id="keys"></div>

    <div class="foot" style="margin-top:24px" id="playFoot"></div>
  </section>

  <div class="foot" id="mainFoot">
    طراحی و ساخت: <b>محمدجواد کجوری</b><br>
    © استودیو محمدجواد کجوری
  </div>

</div>

/* =========================================================
   منطق بازی
   ========================================================= */
const $ = (s) => document.querySelector(s);
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const fa = (n) => Number(n).toLocaleString("fa-IR");

let current = null;
let keyButtons = {};
let doneSet = new Set();

/* ---------- آماده‌سازی صدا ---------- */
let voices = [];
function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  voices = speechSynthesis.getVoices();
}
loadVoices();
if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

/* ---------- تلفظ قوی ---------- */
let currentUtterance = null;
function speak(text, btn) {
  if (!("speechSynthesis" in window)) {
    alert("مرورگر شما از تلفظ پشتیبانی نمی‌کند");
    return;
  }

  try {
    // توقف هر تلفظ در حال اجرا
    speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.85;
    u.pitch = 1;
    u.volume = 1;

    // انتخاب صدای انگلیسی (اولویت آمریکایی)
    if (!voices.length) voices = speechSynthesis.getVoices();
    const preferred =
      voices.find((v) => v.lang === "en-US" && /Google|Samantha|Microsoft/i.test(v.name)) ||
      voices.find((v) => v.lang === "en-US") ||
      voices.find((v) => v.lang.startsWith("en"));
    if (preferred) u.voice = preferred;

    // انیمیشن دکمه
    if (btn) {
      btn.classList.add("speaking");
      u.onend = () => btn.classList.remove("speaking");
      u.onerror = () => btn.classList.remove("speaking");
    }

    currentUtterance = u;
    speechSynthesis.speak(u);
  } catch (e) {
    console.warn("speak error:", e);
  }
}

/* ---------- ساخت کارت‌های دسته ---------- */
const catsEl = $("#cats");
Object.entries(C).forEach(([id, cat]) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "cat";
  btn.dataset.id = id;
  btn.dataset.search = (cat.fa + " " + cat.en).toLowerCase();
  btn.innerHTML = `<span class="emo">${cat.emo}</span>
                   <span class="name">${cat.fa}</span>
                   <span class="en">${cat.en}</span>`;
  btn.addEventListener("click", () => openCat(id));
  catsEl.appendChild(btn);
});
$("#catCount").textContent = fa(Object.keys(C).length) + " دسته";

/* ---------- جستجو ---------- */
$("#search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll("#cats .cat").forEach((b) => {
    b.style.display = !q || b.dataset.search.includes(q) ? "" : "none";
  });
});

/* ---------- ورود به دسته ---------- */
function openCat(id) {
  current = id;
  const cat = C[id];

  $("#ptitle").textContent = cat.emo + " " + cat.fa;

  const keysEl = $("#keys");
  keysEl.innerHTML = "";
  keyButtons = {};
  doneSet = new Set();

  LETTERS.forEach((L) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "key";
    b.textContent = L;
    b.setAttribute("aria-label", "حرف " + L);
    b.addEventListener("click", () => pick(L));
    keysEl.appendChild(b);
    keyButtons[L] = b;
  });

  setEmpty();
  updateProgress();
  $("#playFoot").textContent = C[current].en;

  $("#home").hidden = true;
  $("#play").hidden = false;
  window.scrollTo(0, 0);
}

function setEmpty() {
  const r = $("#result");
  r.className = "result empty";
  r.textContent = "یک حرف را انتخاب کن";
}

function updateProgress() {
  const total = Object.keys(C[current].d).length;
  const pct = total ? (doneSet.size / total) * 100 : 0;
  $("#progFill").style.width = pct + "%";
}

/* ---------- انتخاب حرف ---------- */
function pick(L) {
  const btn = keyButtons[L];
  if (!btn) return;

  document.querySelectorAll(".key.sel").forEach((x) => x.classList.remove("sel"));
  btn.classList.add("sel");

  const r = $("#result");
  const data = C[current].d[L];
  r.innerHTML = "";

  if (!data) {
    r.className = "result none";
    r.textContent = "در این دسته کلمه‌ای با حرف «" + L + "» نداریم";
    btn.classList.add("none");
    return;
  }

  doneSet.add(L);
  btn.classList.add("done");
  updateProgress();

  r.className = "result";

  const letterEl = document.createElement("div");
  letterEl.className = "letter";
  letterEl.textContent = L + " " + L.toLowerCase();

  const wordEl = document.createElement("div");
  wordEl.className = "word";
  wordEl.textContent = data[0];

  const faEl = document.createElement("div");
  faEl.className = "fa";
  faEl.textContent = data[1];

  const spk = document.createElement("button");
  spk.type = "button";
  spk.className = "speak";
  spk.innerHTML = `<span class="icon">🔊</span><span>تلفظ کن</span>`;
  spk.addEventListener("click", (e) => {
    e.stopPropagation();
    speak(data[0], spk);
  });

  if (data[2]) {
    const emojiEl = document.createElement("div");
    emojiEl.style.fontSize = "44px";
    emojiEl.style.lineHeight = "1.1";
    emojiEl.textContent = data[2];
    r.append(letterEl, emojiEl, wordEl, faEl, spk);
  } else {
    r.append(letterEl, wordEl, faEl, spk);
  }

  // تلفظ خودکار
  speak(data[0], spk);
}

/* ---------- بازگشت ---------- */
$("#back").addEventListener("click", () => {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  $("#play").hidden = true;
  $("#home").hidden = false;
  window.scrollTo(0, 0);
});

/* ---------- کیبورد ---------- */
document.addEventListener("keydown", (e) => {
  if ($("#play").hidden) return;
  const L = e.key.toUpperCase();
  if (L.length === 1 && LETTERS.includes(L)) pick(L);
});

/* ---------- اولین لمس برای فعال‌سازی صدا (برای موبایل) ---------- */
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  if ("speechSynthesis" in window) {
    try {
      const u = new SpeechSynthesisUtterance("");
      u.volume = 0;
      speechSynthesis.speak(u);
      speechSynthesis.cancel();
      loadVoices();
    } catch (e) {}
  }
}
document.addEventListener("touchstart", unlockAudio, { once: true });
document.addEventListener("click", unlockAudio, { once: true });
</script>
